<!-- 3. BANNER COMPACTO DE PROGRESO (1 SOLA LÍNEA) -->
      <section id="progressBanner" class="progress-banner-compact" aria-label="Progreso del atleta" role="button" tabindex="0" title="Haz clic para ver tus logros y estadísticas completas">
        <div class="progress-banner-pill">
          <span id="athleteLevelIcon" class="banner-level-badge">⚡</span>
          <span id="xpLevelLabel" class="banner-level-text">Nivel 1</span>
        </div>
        <div class="progress-banner-stats">
          <span id="totalSessionsText" class="banner-stat-val">0</span> <span class="banner-stat-lbl">sesiones</span>
          <span class="banner-dot">·</span>
          <span id="totalVolumeText" class="banner-stat-val">0 kg</span>
          <span class="banner-dot">·</span>
          <span id="xpCurrentLabel" class="banner-stat-val">0 XP</span>
        </div>
        <span class="banner-open-hint">Ver logros ›</span>
      </section>
